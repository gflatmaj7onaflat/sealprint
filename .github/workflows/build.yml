name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries Qt needs on a bare runner
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write            # lets a version tag attach the zip to its release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build SealPrint.exe
        run: pyinstaller --noconfirm --windowed --name SealPrint --icon sealprint.ico sealprint.py
      - name: Check the built exe can make a PDF
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SealPrint\SealPrint.exe -Wait -PassThru `
               -ArgumentList 'examples\red-square.png', '-o', 'smoke.pdf', '--size', '20', '--copies', '4'
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.pdf)) { Write-Error "SealPrint.exe could not make a PDF"; exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SealPrint -DestinationPath SealPrint-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: SealPrint-windows
          path: SealPrint-windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: SealPrint-windows.zip
