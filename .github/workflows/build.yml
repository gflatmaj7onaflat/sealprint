name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries Qt needs on a bare runner
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build SealPrint.exe
        run: pyinstaller --noconfirm --windowed --name SealPrint --icon sealprint.ico sealprint.py
      - name: Check the built exe can make a PDF
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SealPrint\SealPrint.exe -Wait -PassThru `
               -ArgumentList 'examples\red-square.png', '-o', 'smoke.pdf', '--size', '20', '--copies', '4'
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.pdf)) { Write-Error "SealPrint.exe could not make a PDF"; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: SealPrint-windows
          path: dist/SealPrint

  mac:
    needs: test
    runs-on: macos-latest            # Apple Silicon (M1 and later)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build Seal Print.app
        run: >
          pyinstaller --noconfirm --windowed --name "Seal Print" --icon sealprint.icns
          --osx-bundle-identifier io.github.gflatmaj7onaflat.sealprint sealprint.py
      - name: Check the built app can make a PDF
        run: |
          "dist/Seal Print.app/Contents/MacOS/Seal Print" examples/red-square.png -o smoke.pdf --size 20 --copies 4
          test -s smoke.pdf
      - name: Make the disk image
        run: |
          mkdir dmg
          cp -R "dist/Seal Print.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Seal Print" -srcfolder dmg -ov -format UDZO SealPrint-mac.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: SealPrint-mac
          path: SealPrint-mac.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write                # to create the release and attach the downloads
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Package the downloads
        run: |
          mv artifacts/SealPrint-windows artifacts/SealPrint
          (cd artifacts && zip -qr ../SealPrint-windows.zip SealPrint)
          cp artifacts/SealPrint-mac/SealPrint-mac.dmg .
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SealPrint-windows.zip
            SealPrint-mac.dmg
